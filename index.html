<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Галерея супергероев</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --text: #f2f3f7;
    --muted: #8b90a0;
    --accent: #e23636;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header { padding: 40px 20px 20px; text-align: center; }
  h1 { font-size: clamp(1.8rem, 5vw, 3rem); letter-spacing: 1px; }
  h1 span { color: var(--accent); }
  .search-wrap { max-width: 480px; margin: 24px auto 0; }
  #search {
    width: 100%;
    padding: 14px 18px;
    border-radius: 999px;
    border: 2px solid transparent;
    background: var(--card);
    color: var(--text);
    font-size: 1rem;
    outline: none;
    transition: border-color .2s;
  }
  #search:focus { border-color: var(--accent); }
  .count { text-align: center; color: var(--muted); margin: 14px 0 0; font-size: .9rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 20px;
    max-width: 1300px;
    margin: 30px auto;
    padding: 0 20px 60px;
  }
  .card {
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .2s, box-shadow .2s;
  }
  .card:hover { transform: translateY(-6px); box-shadow: 0 10px 25px rgba(226, 54, 54, .25); }
  .photo {
    aspect-ratio: 3 / 4;
    background: linear-gradient(135deg, #272b3a, #1a1d27);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 4rem;
    font-weight: 700;
    color: var(--muted);
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .name { padding: 14px; text-align: center; font-weight: 600; }
  .empty { text-align: center; color: var(--muted); grid-column: 1 / -1; padding: 40px 0; }

  #modal {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, .88);
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column;
    padding: 20px;
    z-index: 10;
  }
  #modal.open { display: flex; }
  #modal img { max-width: 100%; max-height: 80vh; border-radius: 12px; }
  #modal .big-letter { font-size: 10rem; color: var(--muted); }
  #modal h2 { margin-top: 16px; }
  #close {
    position: absolute; top: 18px; right: 24px;
    font-size: 2.2rem; color: var(--text);
    background: none; border: none; cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <h1>Галерея <span>супергероев</span></h1>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Поиск героя..." autocomplete="off">
  </div>
  <p class="count" id="count"></p>
</header>

<main class="grid" id="grid"></main>

<div id="modal">
  <button id="close" aria-label="Закрыть">&times;</button>
  <div id="modal-content"></div>
  <h2 id="modal-name"></h2>
</div>

<script>
  // Формат: ["Имя на сайте", "имя файла картинки без расширения"]
  // Файлы лежат в папке images. Расширение может быть любым (jpg, png, jpeg, webp).
  var heroes = [
    ["Железный человек", "Iron man"],
    ["Капитан Америка", "Captain America"],
    ["Тор", "Thor"],
    ["Халк", "Hulk"],
    ["Чёрная вдова", "Black Widow"],
    ["Соколиный глаз", "Hawk-Eye"],
    ["Человек-паук", "Spider-Man"],
    ["Чёрная пантера", "Black Panther"],
    ["Доктор Стрэндж", "Doctor Strange"],
    ["Капитан Марвел", "Captain Marvel"],
    ["Человек-муравей", "Ant-Man"],
    ["Оса", "Wasp"],
    ["Алая ведьма", "Scarlet Witch"],
    ["Вижн", "Vision"],
    ["Сокол", "Falcon"],
    ["Зимний солдат", "Winter Soldier"],
    ["Звёздный Лорд", "Star-Lord"],
    ["Гамора", "Gamora"],
    ["Дракс", "Drax"],
    ["Ракета", "Rocket"],
    ["Грут", "Groot"],
    ["Мантис", "Mantis"],
    ["Небула", "Nebula"],
    ["Росомаха", "Wolverine"],
    ["Профессор Икс", "Professor X"],
    ["Циклоп", "Cyclops"],
    ["Шторм", "Storm"],
    ["Джин Грей", "Jean Grey"],
    ["Зверь", "Beast"],
    ["Дэдпул", "Deadpool"],
    ["Сорвиголова", "Daredevil"],
    ["Призрачный гонщик", "Ghost Rider"],
    ["Блэйд", "Blade"],
    ["Шан-Чи", "Shang-Chi"],
    ["Мун Найт", "Moon Knight"],
    ["Женщина-Халк", "She-Hulk"],
    ["Мисс Марвел", "Ms. Marvel"],
    ["Серебряный сёрфер", "Silver Surfer"],
    ["Человек-факел", "Human Torch"],
    ["Существо", "Creature"]
  ];

  var EXTENSIONS = ["jpg", "png", "jpeg", "webp", "jfif", "JPG", "PNG", "JPEG"];
  var found = {};

  // Пробуем имя как есть, потом маленькими буквами, потом через дефис.
  function fileNames(base) {
    var out = [];
    function add(x) { if (out.indexOf(x) === -1) out.push(x); }
    add(base);
    add(base.toLowerCase());
    add(base.toLowerCase().replace(/ /g, "-"));
    return out;
  }

  function candidates(base) {
    var out = [];
    fileNames(base).forEach(function (n) {
      EXTENSIONS.forEach(function (ext) {
        out.push("images/" + encodeURIComponent(n) + "." + ext);
      });
    });
    return out;
  }

  function makePhoto(index, big) {
    var hero = heroes[index];
    var wrap = document.createElement("div");
    wrap.className = big ? "" : "photo";

    function letter() {
      wrap.innerHTML = "";
      var span = document.createElement("span");
      if (big) span.className = "big-letter";
      span.textContent = hero[0].charAt(0);
      wrap.appendChild(span);
    }

    if (found[index]) {
      var done = new Image();
      done.src = found[index];
      done.alt = hero[0];
      wrap.appendChild(done);
      return wrap;
    }

    var list = candidates(hero[1]);
    var step = 0;
    var img = new Image();
    img.alt = hero[0];
    img.onload = function () { found[index] = img.src; };
    img.onerror = function () {
      step++;
      if (step < list.length) { img.src = list[step]; } else { letter(); }
    };
    img.src = list[0];
    wrap.appendChild(img);
    return wrap;
  }

  var grid = document.getElementById("grid");
  var search = document.getElementById("search");
  var count = document.getElementById("count");
  var modal = document.getElementById("modal");
  var modalContent = document.getElementById("modal-content");
  var modalName = document.getElementById("modal-name");

  function render() {
    var q = search.value.trim().toLowerCase();
    grid.innerHTML = "";
    var shown = 0;
    heroes.forEach(function (hero, i) {
      var text = (hero[0] + " " + hero[1]).toLowerCase();
      if (text.indexOf(q) === -1) return;
      shown++;
      var card = document.createElement("div");
      card.className = "card";
      card.appendChild(makePhoto(i, false));
      var label = document.createElement("div");
      label.className = "name";
      label.textContent = hero[0];
      card.appendChild(label);
      card.onclick = function () { openModal(i); };
      grid.appendChild(card);
    });
    if (!shown) grid.innerHTML = '<p class="empty">Никого не найдено</p>';
    count.textContent = "Героев: " + shown;
  }

  function openModal(i) {
    modalContent.innerHTML = "";
    modalContent.appendChild(makePhoto(i, true));
    modalName.textContent = heroes[i][0];
    modal.classList.add("open");
  }
  function closeModal() { modal.classList.remove("open"); }

  document.getElementById("close").onclick = closeModal;
  modal.onclick = function (e) { if (e.target === modal) closeModal(); };
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });
  search.addEventListener("input", render);

  render();
</script>
</body>
</html>
